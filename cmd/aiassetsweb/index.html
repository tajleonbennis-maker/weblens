<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebLens 实时资产</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#07111f;color:#dbeafe}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end}.sub{color:#7dd3fc}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:24px 0}.card,.panel{background:#0d1b2e;border:1px solid #1e3a5f;border-radius:12px;padding:16px}.filterable,.tag.filterable{cursor:pointer}.filterable:hover,.filterable.active{border-color:#22d3ee;box-shadow:0 0 0 1px #22d3ee}.num{font-size:28px;font-weight:750;color:#67e8f9}.label{font-size:12px;color:#94a3b8}.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}h1,h2{margin:0 0 10px}.table-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.filter-state{color:#67e8f9;font-size:13px}.clear{border:1px solid #315175;background:#10243d;color:#dbeafe;border-radius:8px;padding:6px 10px;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #1e293b}th{color:#7dd3fc}.yes{color:#4ade80}.bad{color:#fb7185}.tag{display:inline-block;margin:2px;padding:2px 6px;border-radius:10px;background:#17365d;border:1px solid transparent}.url{max-width:370px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{text-align:center;color:#94a3b8;padding:28px}a{color:#93c5fd}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><div class="wrap"><div class="head"><div><h1>WebLens 实时资产</h1><div class="sub">FOFA 分页发现 · 静态 + Lightpanda · Key 强制脱敏</div></div><div id="updated" class="label">加载中</div></div><div id="cards" class="grid"></div><div class="panels"><div class="panel"><h2>组件分布</h2><div id="tech"></div></div><div class="panel"><h2>模型分布</h2><div id="models"></div></div></div><div class="panel"><div class="table-head"><h2 id="assetTitle">全部资产</h2><div><span id="filterState" class="filter-state"></span> <button id="clearFilter" class="clear" hidden>清除筛选</button></div></div><table><thead><tr><th>URL</th><th>状态</th><th>AI</th><th>组件/模型</th><th>泄露点</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KiB':(n/1048576).toFixed(1)+' MiB';
let currentState=null,filter={exposure:false,technology:''};
function renderRows(){if(!currentState)return;let list=[...(currentState.assets||currentState.recent||[])];if(filter.exposure)list=list.filter(a=>(a.keyExposures||[]).length);if(filter.technology)list=list.filter(a=>(a.technologies||[]).some(t=>t.name===filter.technology));const labels=[];if(filter.exposure)labels.push('有泄露点');if(filter.technology)labels.push('组件：'+filter.technology);filterState.textContent=labels.join(' · ');clearFilter.hidden=!labels.length;assetTitle.textContent=labels.length?'筛选资产':'全部资产';rows.innerHTML=list.reverse().map(a=>{const ok=a.httpStatus>=200&&a.httpStatus<300;return `<tr><td class=url><a target=_blank rel=noopener href="${esc(a.assetUrl)}">${esc(a.assetUrl)}</a></td><td class="${a.blocked||a.httpStatus&&!ok?'bad':a.reachable?'yes':''}">${a.blocked?'阻断':a.httpStatus||esc(a.error||'-')}</td><td>${a.aiChat?'✓':'-'}</td><td>${[...(a.technologies||[]).map(x=>x.name),...(a.models||[]).map(x=>x.provider)].map(x=>`<span class=tag>${esc(x)}</span>`).join('')}</td><td class="${(a.keyExposures||[]).length?'bad':''}">${(a.keyExposures||[]).length}</td></tr>`}).join('')||'<tr><td colspan=5 class=empty>没有符合条件的资产</td></tr>'}
async function refresh(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const s=await r.json();currentState=s;updated.textContent='更新 '+new Date(s.updatedAt).toLocaleTimeString()+' · 页 '+s.checkpoint.page+' / 规则 '+s.checkpoint.query+' / 偏移 '+s.checkpoint.offset;const cs=[['已扫描',s.scanned,''],['AI资产',s.aiAssets,''],['可访问',s.reachable,''],['被阻断',s.blocked,''],['泄露资产',s.exposureAssets,'exposure'],['数据量',size(s.dataBytes),'']];cards.innerHTML=cs.map(x=>`<div class="card ${x[2]?'filterable':''} ${x[2]&&filter.exposure?'active':''}" data-filter="${x[2]}"><div class=num>${esc(x[1])}</div><div class=label>${x[0]}</div></div>`).join('');tech.innerHTML=s.technologies.slice(0,15).map(x=>`<span class="tag filterable ${filter.technology===x.name?'active':''}" data-tech="${esc(x.name)}">${esc(x.name)} ${x.count}</span>`).join('')||'暂无';models.innerHTML=s.models.slice(0,15).map(x=>`<span class=tag>${esc(x.name)} ${x.count}</span>`).join('')||'暂无';renderRows()}catch(e){updated.textContent='读取失败：'+e.message}}
cards.addEventListener('click',e=>{const el=e.target.closest('[data-filter="exposure"]');if(!el)return;filter.exposure=!filter.exposure;refresh()});tech.addEventListener('click',e=>{const el=e.target.closest('[data-tech]');if(!el)return;filter.technology=filter.technology===el.dataset.tech?'':el.dataset.tech;refresh()});clearFilter.addEventListener('click',()=>{filter={exposure:false,technology:''};refresh()});refresh();setInterval(refresh,3000);
</script></body></html>
